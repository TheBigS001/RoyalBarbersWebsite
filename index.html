<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  :root {
    --black: #070707;
    --coal: #121212;
    --gold: #c9a14a;
    --gold-bright: #e6c36a;
    --gold-deep: #8a6b25;
    --ivory: #efe8d6;
    --muted: #a99d82;
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--ivory);
    font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    line-height: 1.55;
  }

  /* Barber pole strip: the one moving element on the page */
  .pole {
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--gold) 0 14px,
      var(--black) 14px 28px,
      var(--ivory) 28px 42px,
      var(--black) 42px 56px
    );
    background-size: 79.2px 79.2px;
    animation: spin 2.4s linear infinite;
    border-bottom: 1px solid var(--gold-deep);
  }
  .pole.bottom { border-bottom: 0; border-top: 1px solid var(--gold-deep); }
  @keyframes spin { to { background-position: 79.2px 0; } }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 20px 36px;
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif;
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--gold-bright);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    margin: 0 auto;
    max-width: 52ch;
    color: var(--muted);
    font-size: 1.05rem;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 72px; }

  .grid { columns: 3 280px; column-gap: 18px; }
  .item {
    break-inside: avoid;
    margin: 0 0 18px;
    padding: 0;
    width: 100%;
    display: block;
    cursor: zoom-in;
    background: var(--coal);
    border: 1px solid var(--gold-deep);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    transition: border-color .2s ease;
  }
  .item:hover { border-color: var(--gold-bright); }
  .item:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 3px; }
  .item img { display: block; width: 100%; height: auto; }
  .item span {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 34px 14px 12px;
    text-align: left;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif;
    font-size: 1.15rem;
    color: var(--gold-bright);
    background: linear-gradient(transparent, rgba(0,0,0,.88));
  }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .95);
    padding: 24px;
  }
  .lb.open { display: flex; }
  .lb figure { margin: 0; max-width: 100%; max-height: 100%; text-align: center; }
  .lb img {
    max-width: 100%; max-height: 78vh;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
  }
  .lb figcaption {
    margin-top: 14px;
    color: var(--gold-bright);
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif;
    font-size: 1.2rem;
  }
  .lb figcaption small { display: block; color: var(--muted); font-family: inherit; font-size: .85rem; margin-top: 2px; }
  .lb button {
    position: absolute; cursor: pointer;
    background: var(--black); color: var(--gold-bright);
    border: 1px solid var(--gold);
    width: 46px; height: 46px; border-radius: 50%; font-size: 1.5rem; line-height: 1;
  }
  .lb button:hover { background: var(--gold); color: var(--black); }
  .lb button:focus-visible { outline: 3px solid var(--ivory); outline-offset: 2px; }
  .lb .close { top: 16px; right: 16px; }
  .lb .prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 16px; top: 50%; transform: translateY(-50%); }

  @media (prefers-reduced-motion: reduce) {
    .pole { animation: none; }
    .item { transition: none; }
  }
</style>
</head>
<body>

<div class="pole" aria-hidden="true"></div>

<header>
  <h1>Gallery</h1>
  <p>A look inside the shop and at the work we turn out. Select any photo to view it full size.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="pole bottom" aria-hidden="true"></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <button class="prev" id="prev" aria-label="Previous image">&#8249;</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="next" id="next" aria-label="Next image">&#8250;</button>
</div>

<script>
  // Add, remove or reorder photos here.
  const photos = [
    { alt: "Exterior",        src: "https://lh3.googleusercontent.com/grass-cs/AABkmLenAcFthcm65useGt6W3K88VQhR5Td-sGW3hRjLx8SlOckL8gouNFB3LjjGMRjnq3RhdFiYFZC70hPwRByQmOfc4GUYJWtgJG-NPfbO3ohDsjO3X8SlUb_K7lwXqZ6I99J2jlWg=s0" },
    { alt: "Interior",        src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9STelOHNQ6TdI1AbWJdUtM5Oaq6ZWSZbP_5pOfYK5bMc9MldOxQU004VZ3nr5XNT0CsspftK3r6TybcJQEN0A049m1vvcQsBOyM05talk1sviIInqIegc7x62OzJ1LqUbaH4-4E=s0" },
    { alt: "The Owner",       src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9Q_FvANsyvJ2YiD8ZkK7HKtAKsnsNH9sbEnbWO2ZwRo36lcCcQHGTqv3_OjLDwDJPxWSDKpX9E5YyHY8t-VzF3L8Q0ilpt7tgTcVnLRFyaZ10HOeBv4duNFDTvbbxb8a92qciyuPw=s0" },
    { alt: "Menu",            src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9RS8ErmR93iuzaTYvwvfHAJs5D2NCCbycTVENFOvjOhVec-kdU_vGISPzkYS6X27ScG9srIu-TQISY5yml6gw_falGU7YWfP9f8o0tBcZYBDCIeTBPTl5IobnasDpJ6tSieSpdCgFVLmUOF=s0" },
    { alt: "Finished Result", src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9ShyWF3VGDdt7fJ22nHF7uXiFStWTiGAgthmzrVrLVWvGo0vwBcRpCwbV9pkSLOtgHVOm-CZc9HDo9uAVMvbEx-svZtJB8Y27IFbDN4C3WwQ2CcD8Esq-7MV7MpFaHI8YMyEClp=s0" }
  ];

  const grid = document.getElementById("grid");
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCap");
  let current = 0;
  let lastFocus = null;

  photos.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.setAttribute("aria-label", "Open " + p.alt);

    const img = document.createElement("img");
    img.src = p.src.replace("=s0", "=w800");   // smaller version for the grid
    img.alt = p.alt;
    img.loading = "lazy";

    const cap = document.createElement("span");
    cap.textContent = p.alt;

    btn.append(img, cap);
    btn.addEventListener("click", () => open(i));
    grid.appendChild(btn);
  });

  function show(i) {
    current = (i + photos.length) % photos.length;
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].alt;
    lbCap.textContent = photos[current].alt;
    const count = document.createElement("small");
    count.textContent = (current + 1) + " of " + photos.length;
    lbCap.appendChild(count);
  }
  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.classList.add("open");
    document.getElementById("close").focus();
    document.body.style.overflow = "hidden";
  }
  function close() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  document.getElementById("close").addEventListener("click", close);
  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });
</script>
</body>
</html>

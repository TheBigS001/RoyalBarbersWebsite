<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  :root {
    --bg: #eef1f4;
    --ink: #1c2530;
    --muted: #5d6b7a;
    --accent: #2f5d8a;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a20;
      --ink: #e9edf1;
      --muted: #9aa7b4;
      --accent: #7fb0e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 20px 24px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }

  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 64px; }

  .grid { columns: 3 280px; column-gap: 14px; }
  .item {
    break-inside: avoid;
    margin: 0 0 14px;
    padding: 0;
    border: 0;
    background: none;
    width: 100%;
    display: block;
    cursor: zoom-in;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
  }
  .item img { display: block; width: 100%; height: auto; transition: transform .25s ease; }
  .item:hover img { transform: scale(1.03); }
  .item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .item span {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 24px 12px 10px;
    color: #fff; font-size: .9rem; text-align: left;
    background: linear-gradient(transparent, rgba(0,0,0,.6));
  }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: rgba(8, 11, 15, .92);
    padding: 24px;
  }
  .lb.open { display: flex; }
  .lb figure { margin: 0; max-width: 100%; max-height: 100%; text-align: center; }
  .lb img { max-width: 100%; max-height: 80vh; border-radius: var(--radius); }
  .lb figcaption { color: #d5dce3; margin-top: 12px; }
  .lb button {
    position: absolute; border: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff;
    width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem;
  }
  .lb button:hover { background: rgba(255,255,255,.25); }
  .lb button:focus-visible { outline: 3px solid #fff; }
  .lb .close { top: 16px; right: 16px; }
  .lb .prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 16px; top: 50%; transform: translateY(-50%); }
  @media (prefers-reduced-motion: reduce) {
    .item img { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Gallery</h1>
  <p>A selection of photos. Select any image to view it full size.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <button class="prev" id="prev" aria-label="Previous image">&#8249;</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="next" id="next" aria-label="Next image">&#8250;</button>
</div>

<script>
  // Add, remove or reorder photos here.
  const photos = [
    { alt: "Photo",            src: "https://lh3.googleusercontent.com/grass-cs/AABkmLenAcFthcm65useGt6W3K88VQhR5Td-sGW3hRjLx8SlOckL8gouNFB3LjjGMRjnq3RhdFiYFZC70hPwRByQmOfc4GUYJWtgJG-NPfbO3ohDsjO3X8SlUb_K7lwXqZ6I99J2jlWg=s0" },
    { alt: "July 2022",        src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9Q_FvANsyvJ2YiD8ZkK7HKtAKsnsNH9sbEnbWO2ZwRo36lcCcQHGTqv3_OjLDwDJPxWSDKpX9E5YyHY8t-VzF3L8Q0ilpt7tgTcVnLRFyaZ10HOeBv4duNFDTvbbxb8a92qciyuPw=s0" },
    { alt: "Menu",             src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9RS8ErmR93iuzaTYvwvfHAJs5D2NCCbycTVENFOvjOhVec-kdU_vGISPzkYS6X27ScG9srIu-TQISY5yml6gw_falGU7YWfP9f8o0tBcZYBDCIeTBPTl5IobnasDpJ6tSieSpdCgFVLmUOF=s0" },
    { alt: "From the owner",   src: "https://lh3.googleusercontent.com/gps-cs-s/ANWiy9ShyWF3VGDdt7fJ22nHF7uXiFStWTiGAgthmzrVrLVWvGo0vwBcRpCwbV9pkSLOtgHVOm-CZc9HDo9uAVMvbEx-svZtJB8Y27IFbDN4C3WwQ2CcD8Esq-7MV7MpFaHI8YMyEClp=s0" }
  ];

  const grid = document.getElementById("grid");
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCap");
  let current = 0;
  let lastFocus = null;

  photos.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.setAttribute("aria-label", "Open " + p.alt);

    const img = document.createElement("img");
    img.src = p.src.replace("=s0", "=w800");   // smaller version for the grid
    img.alt = p.alt;
    img.loading = "lazy";

    const cap = document.createElement("span");
    cap.textContent = p.alt;

    btn.append(img, cap);
    btn.addEventListener("click", () => open(i));
    grid.appendChild(btn);
  });

  function show(i) {
    current = (i + photos.length) % photos.length;
    lbImg.src = photos[current].src;
    lbImg.alt = photos[current].alt;
    lbCap.textContent = photos[current].alt + " (" + (current + 1) + " of " + photos.length + ")";
  }
  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.classList.add("open");
    document.getElementById("close").focus();
    document.body.style.overflow = "hidden";
  }
  function close() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  document.getElementById("close").addEventListener("click", close);
  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });
</script>
</body>
</html>
